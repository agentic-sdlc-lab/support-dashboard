# Dependency gate: the package guard, placed at the other point where dependencies
# actually get installed.
#
# This job deliberately shows three outcomes, because the difference between them is
# the whole lesson:
#
#   1. python -m pip   not shimmed at all           -> installs, job green
#   2. pip             shimmed, but setup-python's bin
#                      comes first on PATH          -> installs, job green
#   3. pmg pip         the guard is unambiguously
#                      in the path                  -> BLOCKED
#
# A gate that is installed and configured is not the same as a gate that is in the
# path. Steps 1 and 2 are what a reasonable person writes, and both are silent.
name: dependency-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guarded-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package guard
        uses: safedep/pmg@v1
        with:
          verbosity: normal
          disable-telemetry: "true"

      - name: Which pip actually runs?
        run: |
          echo "pip resolves to: $(command -v pip)"
          echo "pmg resolves to: $(command -v pmg)"
          echo "--- PATH order:"; tr ':' '\n' <<< "$PATH" | head -6

      - name: 1. python -m pip  (never shimmed)
        continue-on-error: true
        run: |
          echo "::warning::python -m pip bypasses the shim entirely"
          python -m pip install --no-cache-dir -r requirements-dev.txt
          echo "RESULT: installed, unmediated"

      - name: 2. bare pip  (shim loses to setup-python on PATH)
        continue-on-error: true
        run: |
          python -m pip uninstall -y safedep-test-pkg >/dev/null 2>&1 || true
          echo "::warning::setup-python's bin precedes the shim dir, so this is real pip"
          pip install --no-cache-dir -r requirements-dev.txt
          echo "RESULT: installed, unmediated"

      - name: 3. pmg pip  (the guard is in the path)
        run: |
          python -m pip uninstall -y safedep-test-pkg >/dev/null 2>&1 || true
          pmg pip install --no-cache-dir -r requirements-dev.txt
          echo "RESULT: this line should never be reached"
