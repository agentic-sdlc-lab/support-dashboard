# Dependency gate. PMG mediates package acquisition INSIDE CI, so a malicious
# dependency fails the build in the Actions log rather than only on a laptop.
#
# This is the same control as the local one, placed at the other point where
# dependencies actually get installed.
name: dependency-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guarded-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package guard
        uses: safedep/pmg@v1
        with:
          verbosity: normal
          disable-telemetry: "true"

      # The guard shims `pip`. `python -m pip` goes straight around the shim, so this
      # job is deliberately split to show both: the bypass passes, the guarded call
      # blocks. A gate that is installed, configured and green is not the same as a
      # gate that is in the path.
      - name: Install the way that BYPASSES the guard
        continue-on-error: true
        run: |
          echo "::warning::python -m pip is not shimmed; the guard never sees this"
          python -m pip install --no-cache-dir --prefer-binary -r requirements-dev.txt
          echo "installed WITHOUT mediation"

      - name: Install the way the guard actually sees
        run: |
          python -m pip uninstall -y safedep-test-pkg 2>/dev/null || true
          pip install --no-cache-dir --prefer-binary -r requirements-dev.txt
          echo "dependencies installed and mediated"

      - name: Run the protected test
        run: python -m pytest tests/ -q
